<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frituur Voorraad</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#d9480f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fbf7ef;--card:#fff;--ink:#2a2118;--mut:#7a6d5e;--line:#e8dfd0;--acc:#d9480f;--acc2:#fff;--ok:#2b8a3e;--bad:#c92a2a;--warn:#e67700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1a1612;--card:#262019;--ink:#f3ebdd;--mut:#a69883;--line:#3a3128;--acc:#ff8c42;--acc2:#1a1612;--ok:#69db7c;--bad:#ff8787;--warn:#ffc078}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1a1612;--card:#262019;--ink:#f3ebdd;--mut:#a69883;--line:#3a3128;--acc:#ff8c42;--acc2:#1a1612;--ok:#69db7c;--bad:#ff8787;--warn:#ffc078}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line);z-index:5}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:18px;margin:0}
.badge{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);white-space:nowrap}
.badge.on{color:var(--ok)}.badge.off{color:var(--warn)}
.total{display:flex;gap:10px;margin-top:8px}
.kpi{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.kpi small{color:var(--mut);display:block;font-size:12px}.kpi b{font-size:20px}
main{padding:12px 16px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
.tabs button{flex:1;border:0;background:none;color:var(--mut);padding:12px 4px;font-size:13px;font-weight:600}
.tabs button.act{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
button.pri{background:var(--acc);color:var(--acc2);border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:700;width:100%}
button.sec{background:none;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:15px}
button:disabled{opacity:.5}
input,select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:16px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.seg button{flex:1;border:0;padding:14px;font-size:16px;font-weight:700;background:var(--card);color:var(--mut)}
.seg button.in.act{background:var(--ok);color:var(--acc2)}
.seg button.out.act{background:var(--bad);color:var(--acc2)}
video{width:100%;border-radius:12px;background:#000;max-height:260px;object-fit:cover;margin-bottom:10px}
.qty{display:flex;align-items:center;gap:10px;margin:10px 0}
.qty button{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:24px}
.qty input{text-align:center;font-size:20px;font-weight:700}
.item{display:flex;justify-content:space-between;gap:10px;align-items:center}
.item .n{font-weight:700}.item .s{color:var(--mut);font-size:13px}
.q{font-size:22px;font-weight:800;text-align:right}
.low{color:var(--bad)}
.pill{font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.toast{position:fixed;left:16px;right:16px;bottom:88px;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;z-index:20;display:none;font-weight:600}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(92vw,420px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.hide{display:none}
</style>
</head>
<body>
<header>
  <div class="row"><h1>🍟 Frituur Voorraad</h1><span id="sync" class="badge">…</span></div>
  <div class="total">
    <div class="kpi"><small>Waarde stock</small><b id="tv">€ 0,00</b></div>
    <div class="kpi"><small>Te bestellen</small><b id="tb">0</b></div>
  </div>
</header>
<main>
  <section id="v-scan">
    <div class="seg"><button class="in act" id="mIn">➕ Inklokken</button><button class="out" id="mOut">➖ Uitklokken</button></div>
    <video id="cam" class="hide" playsinline muted></video>
    <button class="pri" id="camBtn">📷 Camera starten</button>
    <label>Of typ / scan barcode (ook met bluetooth-scanner)</label>
    <div class="row"><input id="bc" inputmode="numeric" placeholder="Barcode" autocomplete="off"><button class="sec" id="bcGo">OK</button></div>
    <label>Aantal per scan</label>
    <div class="qty"><button id="qm">−</button><input id="qn" type="number" inputmode="numeric" value="1" min="1"><button id="qp">+</button></div>
    <div class="card" id="last" style="display:none"></div>
  </section>
  <section id="v-stock" class="hide">
    <button class="pri" id="scanP" style="margin-bottom:8px">📷 Nieuw product scannen</button>
    <button class="sec" id="addP" style="width:100%;margin-bottom:10px">+ Nieuw product handmatig</button>
    <input id="srch" placeholder="Zoeken…" style="margin-bottom:10px">
    <div id="stockList"></div>
    <div class="card"><b>Back-up</b><div class="s" style="color:var(--mut);font-size:13px">Alles staat enkel op dit toestel. Maak regelmatig een back-up.</div><div class="s" id="bkInfo" style="font-size:13px;margin:4px 0"></div><div class="g2" style="margin-top:8px"><button class="sec" id="bkE">⬇ Exporteren</button><button class="sec" id="bkI">⬆ Herstellen</button></div><input type="file" id="bkF" accept=".json,application/json" class="hide"></div>
  </section>
  <section id="v-order" class="hide"><div id="orderList"></div></section>
  <section id="v-use" class="hide"><div id="useList"></div></section>
  <section id="v-log" class="hide"><div id="logList"></div></section>
</main>
<nav class="tabs">
  <button data-t="scan" class="act">📷<br>Scan</button>
  <button data-t="stock">📦<br>Voorraad</button>
  <button data-t="order">🛒<br>Bestellen</button>
  <button data-t="use">📈<br>Verbruik</button>
  <button data-t="log">🕘<br>Historiek</button>
</nav>
<div class="toast" id="toast"></div>

<dialog id="dlg">
  <h3 id="dT" style="margin:0 0 4px">Product</h3>
  <label>Barcode (leeg = zonder barcode)</label>
  <div class="row"><input id="fBc" inputmode="numeric" style="flex:1"><button class="sec" id="fScan">📷 Scan</button></div>
  <label>Naam</label><input id="fN">
  <div class="g2">
    <div><label>Inkoopprijs per stuk (€)</label><input id="fP" type="number" step="0.01" inputmode="decimal"></div>
    <div><label>Eenheid</label><input id="fU" placeholder="stuk, kg, doos"></div>
    <div><label>Huidige voorraad</label><input id="fQ" type="number" step="any" inputmode="decimal"></div>
    <div><label>Bestellen bij ≤</label><input id="fM" type="number" step="any" inputmode="decimal"></div>
  </div>
  <label>Gewenste voorraad na bestelling</label><input id="fT" type="number" step="any" inputmode="decimal">
  <div class="g2" style="margin-top:14px"><button class="sec" id="fX">Annuleer</button><button class="pri" id="fS">Opslaan</button></div>
  <button class="sec" id="fD" style="width:100%;margin-top:10px;color:var(--bad)">Verwijder product</button>
</dialog>

<dialog id="sdlg">
  <h3 style="margin:0 0 10px">Scan de barcode</h3>
  <video id="sv" playsinline muted></video>
  <button class="sec" id="sX" style="width:100%">Annuleer</button>
</dialog>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
<script>
(function(){
var KEY="frituur_v1";
var S={products:{},log:[]};
try{var raw=localStorage.getItem(KEY);if(raw){S=JSON.parse(raw);S.products=S.products||{};S.log=S.log||[];}}catch(e){}
var $=function(i){return document.getElementById(i)};
var mode="in",pending=null,editing=null,db=null,syncing=false;
var eur=new Intl.NumberFormat("nl-BE",{style:"currency",currency:"EUR"});
var nf=new Intl.NumberFormat("nl-BE",{maximumFractionDigits:2});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function did(bc){return "p_"+String(bc).replace(/[^A-Za-z0-9_-]/g,"_")}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none"},2200)}
function live(){return Object.keys(S.products).map(function(k){return S.products[k]}).filter(function(p){return !p.deleted})}
function low(p){return p.min!=null&&p.min!==""&&p.qty<=p.min}

/* ---------- acties ---------- */
function addLog(p,delta,type){S.log.unshift({id:uid(),ts:Date.now(),bc:p.bc,name:p.name,delta:delta,type:type,synced:false})}
function apply(bc,delta,type){
  var p=S.products[bc];if(!p||p.deleted)return false;
  p.qty=Math.round((p.qty+delta)*1000)/1000;p.upd=Date.now();p.dirty=true;
  addLog(p,delta,type);save();render();trySync();return p;
}
function handleCode(code){
  code=String(code).trim();if(!code)return;
  var n=Math.max(1,parseFloat($("qn").value)||1);
  var p=S.products[code];
  if(p&&!p.deleted){
    var d=mode==="in"?n:-n;
    apply(code,d,mode);
    var q=S.products[code];
    var L=$("last");L.style.display="block";
    L.innerHTML="<div class='item'><div><div class='n'>"+esc(q.name)+"</div><div class='s'>"+(d>0?"+":"")+d+" "+esc(q.unit||"")+" geboekt</div></div><div class='q "+(low(q)?"low":"")+"'>"+nf.format(q.qty)+"</div></div>"+(low(q)?"<div class='s low' style='margin-top:6px'>⚠ Bijbestellen: onder minimum ("+q.min+")</div>":"");
    toast((d>0?"➕ ":"➖ ")+q.name+" → "+nf.format(q.qty));
    if(navigator.vibrate)navigator.vibrate(60);
  }else{
    pending={code:code,delta:mode==="in"?n:-n};
    openDlg(null,code);
  }
}

/* ---------- weergave ---------- */
function render(){
  var ps=live(),tv=0,tb=0;
  ps.forEach(function(p){tv+=(p.qty||0)*(p.price||0);if(low(p))tb++});
  $("tv").textContent=eur.format(tv);$("tb").textContent=tb;
  var f=($("srch").value||"").toLowerCase();
  var list=ps.filter(function(p){return !f||p.name.toLowerCase().indexOf(f)>-1||String(p.bc).indexOf(f)>-1}).sort(function(a,b){return a.name.localeCompare(b.name)});
  $("stockList").innerHTML=list.length?list.map(function(p){
    return "<div class='card item' data-bc='"+esc(p.bc)+"' style='cursor:pointer'><div><div class='n'>"+esc(p.name)+(low(p)?"<span class='pill'>bestellen</span>":"")+"</div><div class='s'>"+(String(p.bc).indexOf("M")===0?"geen barcode":esc(p.bc))+" · "+eur.format(p.price||0)+" /"+esc(p.unit||"stuk")+" · waarde "+eur.format((p.qty||0)*(p.price||0))+"</div></div><div class='q "+(low(p)?"low":"")+"'>"+nf.format(p.qty)+"<div class='s'>"+esc(p.unit||"")+"</div></div></div>";
  }).join(""):"<div class='empty'>Nog geen producten.<br>Scan een barcode of voeg een product toe.</div>";
  var ord=ps.filter(low).sort(function(a,b){return a.name.localeCompare(b.name)});
  var ot=0;
  $("orderList").innerHTML=ord.length?ord.map(function(p){
    var t=(p.target!=null&&p.target!=="")?p.target:(p.min*2);var need=Math.max(0,Math.ceil((t-p.qty)*100)/100);ot+=need*(p.price||0);
    return "<div class='card item'><div><div class='n'>"+esc(p.name)+"</div><div class='s'>Nu "+nf.format(p.qty)+" · minimum "+p.min+" · streef "+t+"</div></div><div class='q low'>+"+nf.format(need)+"<div class='s'>"+esc(p.unit||"")+"</div></div></div>";
  }).join("")+"<div class='card item'><b>Geschatte kost bestelling</b><b>"+eur.format(ot)+"</b></div>":"<div class='empty'>✅ Alles op voorraad.<br>Niets om bij te bestellen.</div>";
  $("logList").innerHTML=S.log.length?S.log.slice(0,200).map(function(l){
    var dt=new Date(l.ts).toLocaleString("nl-BE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
    return "<div class='card item'><div><div class='n'>"+esc(l.name)+"</div><div class='s'>"+dt+" · "+esc(l.type)+""+"</div></div><div class='q' style='color:var(--"+(l.delta>0?"ok":"bad")+")'>"+(l.delta>0?"+":"")+nf.format(l.delta)+"</div></div>";
  }).join(""):"<div class='empty'>Nog geen acties.</div>";
  renderUse();syncBadge();
}
function renderUse(){
  var now=Date.now(),nd=new Date(now),m={};
  S.log.forEach(function(l){
    var u=m[l.bc]||(m[l.bc]={first:l.ts,out:0,cur:0,prev:0});
    if(l.ts<u.first)u.first=l.ts;
    if(l.delta<0&&(l.type==="out"||l.type==="uit")){
      var a=-l.delta,d=new Date(l.ts),diff=(nd.getFullYear()-d.getFullYear())*12+nd.getMonth()-d.getMonth();
      u.out+=a;if(diff===0)u.cur+=a;else if(diff===1)u.prev+=a;
    }
  });
  var rows=live().map(function(p){
    var u=m[p.bc]||{first:now,out:0,cur:0,prev:0};
    var months=Math.max(1,(now-u.first)/(30.44*864e5));
    var avg=u.out/months;
    var weeks=avg>0?p.qty/(avg/4.345):null;
    return {p:p,u:u,avg:avg,weeks:weeks,months:months};
  }).filter(function(r){return r.u.out>0}).sort(function(a,b){return b.avg-a.avg});
  var tc=0;rows.forEach(function(r){tc+=r.avg*(r.p.price||0)});
  $("useList").innerHTML=rows.length?"<div class='card item'><div><div class='n'>Gemiddeld verbruik per maand</div><div class='s'>in inkoopwaarde</div></div><div class='q'>"+eur.format(tc)+"</div></div>"+rows.map(function(r){
    var warn=r.weeks!=null&&r.weeks<1;
    return "<div class='card item'><div><div class='n'>"+esc(r.p.name)+"</div><div class='s'>Deze maand "+nf.format(r.u.cur)+" · vorige maand "+nf.format(r.u.prev)+"<br>"+(r.weeks!=null?"Voorraad genoeg voor ± "+nf.format(Math.round(r.weeks*10)/10)+" weken":"")+(r.months<=1?" · nog weinig data":"")+"</div></div><div class='q"+(warn?" low":"")+"'>"+nf.format(Math.round(r.avg*10)/10)+"<div class='s'>"+esc(r.p.unit||"")+"/maand</div></div></div>";
  }).join(""):"<div class='empty'>Nog geen verbruik geboekt.<br>Gebruik ➖ Uitklokken om het verbruik bij te houden.</div>";
}
function syncBadge(){
  var pend=S.log.filter(function(l){return !l.synced}).length+live().filter(function(p){return p.dirty}).length+Object.keys(S.products).filter(function(k){return S.products[k].deleted&&S.products[k].dirty}).length;
  var b=$("sync"),on=navigator.onLine;
  b.className="badge "+(on?"on":"off");
  b.textContent="💾 Lokaal opgeslagen";b.className="badge on";
}

/* ---------- dialoog product ---------- */
function openDlg(bc,newCode){
  editing=bc;var p=bc?S.products[bc]:null;
  $("dT").textContent=p?"Product bewerken":"Nieuw product";
  $("fBc").value=p?(String(p.bc).indexOf("M")===0?"":p.bc):(newCode||"");
  $("fBc").disabled=!!p;$("fScan").disabled=!!p;
  $("fN").value=p?p.name:"";$("fP").value=p?p.price:"";$("fU").value=p?p.unit:"";
  $("fQ").value=p?p.qty:(pending?"0":"0");$("fM").value=p?p.min:"";$("fT").value=p?p.target:"";
  $("fD").style.display=p?"block":"none";
  $("dlg").showModal();
}
$("fX").onclick=function(){pending=null;$("dlg").close()};
$("dlg").addEventListener("cancel",function(){pending=null});
$("fS").onclick=function(){
  var name=$("fN").value.trim();if(!name){toast("Geef een naam in");return}
  var num=function(i){var v=parseFloat($(i).value);return isNaN(v)?null:v};
  var bc=editing||$("fBc").value.trim()||("M"+uid());
  if(!editing&&S.products[bc]&&!S.products[bc].deleted){toast("Barcode bestaat al");return}
  var old=S.products[bc];var q=num("fQ")||0;
  var p={bc:bc,name:name,price:num("fP")||0,unit:$("fU").value.trim()||"stuk",qty:old&&!old.deleted?old.qty:0,min:num("fM"),target:num("fT"),upd:Date.now(),dirty:true};
  S.products[bc]=p;
  if(q!==p.qty){var d=q-p.qty;p.qty=q;addLog(p,d,old&&!old.deleted?"correctie":"start")}
  if(pending){var pd=pending;pending=null;p.qty=Math.round((p.qty+pd.delta)*1000)/1000;addLog(p,pd.delta,pd.delta>0?"in":"uit");toast(name+" → "+nf.format(p.qty))}
  save();$("dlg").close();render();trySync();
};
$("fD").onclick=function(){
  if(!editing||!confirm("Product verwijderen?"))return;
  var p=S.products[editing];p.deleted=true;p.dirty=true;p.upd=Date.now();save();$("dlg").close();render();trySync();
};

/* ---------- UI events ---------- */
$("mIn").onclick=function(){mode="in";$("mIn").classList.add("act");$("mOut").classList.remove("act")};
$("mOut").onclick=function(){mode="out";$("mOut").classList.add("act");$("mIn").classList.remove("act")};
$("qm").onclick=function(){$("qn").value=Math.max(1,(parseFloat($("qn").value)||1)-1)};
$("qp").onclick=function(){$("qn").value=(parseFloat($("qn").value)||0)+1};
$("bcGo").onclick=function(){handleCode($("bc").value);$("bc").value="";$("bc").focus()};
$("bc").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();$("bcGo").click()}});
$("addP").onclick=function(){pending=null;openDlg(null,"")};
$("srch").oninput=render;
$("stockList").onclick=function(e){var c=e.target.closest(".item");if(c){pending=null;openDlg(c.getAttribute("data-bc"))}};
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){
  document.querySelectorAll(".tabs button").forEach(function(x){x.classList.remove("act")});b.classList.add("act");
  ["scan","stock","order","use","log"].forEach(function(t){$("v-"+t).classList.toggle("hide",t!==b.dataset.t)});
  if(b.dataset.t!=="scan")stopCam();window.scrollTo(0,0);
}});

/* ---------- camera / barcode ---------- */
var stream=null,timer=null,det=null,lastCode="",lastAt=0;
function stopCam(){clearInterval(timer);if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}$("cam").classList.add("hide");$("camBtn").textContent="📷 Camera starten"}
$("camBtn").onclick=async function(){
  if(stream){stopCam();return}
  if(!("BarcodeDetector" in window)){toast("Camera-scan niet ondersteund: typ de barcode of gebruik een scanner");return}
  try{
    det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39","qr_code"]});
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
    var v=$("cam");v.srcObject=stream;v.classList.remove("hide");await v.play();$("camBtn").textContent="⏹ Camera stoppen";
    timer=setInterval(async function(){
      if($("dlg").open)return;
      try{var r=await det.detect(v);if(r.length){var c=r[0].rawValue,now=Date.now();if(c!==lastCode||now-lastAt>2500){lastCode=c;lastAt=now;handleCode(c)}}}catch(e){}
    },250);
  }catch(e){stopCam();toast("Geen cameratoegang. Typ de barcode of geef toestemming.")}
};

/* ---------- nieuw product scannen ---------- */
var sStream=null,sTimer=null;
function stopScan(){clearInterval(sTimer);if(sStream){sStream.getTracks().forEach(function(t){t.stop()});sStream=null}if($("sdlg").open)$("sdlg").close()}
async function scanOnce(cb){
  if(!("BarcodeDetector" in window)){toast("Camera-scan niet ondersteund: typ de barcode in");return}
  stopCam();
  try{
    var d=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128","code_39","qr_code"]});
    sStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
    var v=$("sv");v.srcObject=sStream;$("sdlg").showModal();await v.play();
    sTimer=setInterval(async function(){
      try{var r=await d.detect(v);if(r.length){var c=r[0].rawValue;stopScan();if(navigator.vibrate)navigator.vibrate(60);cb(c)}}catch(e){}
    },250);
  }catch(e){stopScan();toast("Geen cameratoegang. Typ de barcode in.")}
}
$("sX").onclick=stopScan;
$("sdlg").addEventListener("close",stopScan);
$("scanP").onclick=function(){
  scanOnce(function(c){
    var p=S.products[c];pending=null;
    if(p&&!p.deleted){toast("Bestaat al: "+p.name);openDlg(c)}
    else{openDlg(null,c);setTimeout(function(){$("fN").focus()},100)}
  });
};
$("fScan").onclick=function(){scanOnce(function(c){$("fBc").value=c;$("fN").focus()})};

/* ---------- back-up ---------- */
function bkInfo(){var t=S.lastBackup?new Date(S.lastBackup).toLocaleDateString("nl-BE",{day:"2-digit",month:"2-digit",year:"numeric"}):null;$("bkInfo").textContent=t?"Laatste back-up: "+t:"Nog geen back-up gemaakt"}
$("bkE").onclick=async function(){
  var data=JSON.stringify({app:"frituur-voorraad",v:1,exported:Date.now(),products:S.products,log:S.log},null,1);
  var name="frituur-voorraad-"+new Date().toISOString().slice(0,10)+".json";
  var done=false;
  try{
    var dl=(window.claude&&claude.use)?await claude.use("downloads"):null;
    if(dl){await dl.save({filename:name,data:data});done=true}
  }catch(e){if(e&&e.code==="declined")return}
  if(!done){
    try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();done=true}catch(e){}
  }
  if(done){S.lastBackup=Date.now();save();bkInfo();toast("Back-up gemaakt")}else toast("Back-up mislukt");
};
$("bkI").onclick=function(){$("bkF").click()};
$("bkF").onchange=function(){
  var f=this.files[0];this.value="";if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var j=JSON.parse(r.result);
      if(!j||j.app!=="frituur-voorraad"||typeof j.products!=="object")throw 0;
      var n=Object.keys(j.products).filter(function(k){return !j.products[k].deleted}).length;
      if(!confirm("Huidige gegevens vervangen door deze back-up ("+n+" producten)?"))return;
      S.products=j.products;S.log=j.log||[];save();render();toast("Back-up hersteld");
    }catch(e){toast("Ongeldig back-upbestand")}
  };
  r.readAsText(f);
};

/* ---------- synchronisatie ---------- */
async function trySync(){
  if(syncing||!db||!navigator.onLine){syncBadge();return}
  syncing=true;syncBadge();
  try{
    var snap=await db.collection("products").get();
    snap.docs.forEach(function(d){
      var r=d.data();if(!r||r.bc==null)return;var l=S.products[r.bc];
      if(!l||(!l.dirty&&(r.upd||0)>(l.upd||0))){S.products[r.bc]=Object.assign({},r,{dirty:false})}
    });
    var bcs=Object.keys(S.products);
    for(var i=0;i<bcs.length;i++){var p=S.products[bcs[i]];if(p.dirty){var o=Object.assign({},p);delete o.dirty;await db.doc("products/"+did(p.bc)).set(o);p.dirty=false}}
    for(var j=0;j<S.log.length;j++){var l2=S.log[j];if(!l2.synced){var o2=Object.assign({},l2);delete o2.synced;await db.doc("log/"+l2.id).set(o2);l2.synced=true}}
    save();
  }catch(e){}
  syncing=false;render();
}
window.addEventListener("online",trySync);
window.addEventListener("offline",syncBadge);
setInterval(trySync,30000);
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
bkInfo();
})();
</script>
